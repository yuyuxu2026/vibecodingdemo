<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e7">
<meta name="color-scheme" content="light">
<title>水果消消乐 · 三个连成线</title>
<style>
  :root {
    --board-size: min(94vw, 62vh, 660px);
    --gap: clamp(3px, calc(var(--board-size) * 0.0095), 7px);
    --cell-radius: clamp(10px, calc(var(--board-size) * 0.024), 18px);
    --fruit-size: clamp(20px, calc(var(--board-size) * 0.07), 46px);
    --ink: #48225f;
    --ink-soft: rgba(72, 34, 95, 0.66);
    --cream: #fffaf0;
    --pink: #ff8bb9;
    --yellow: #ffd84d;
    --purple: #7d4cc4;
  }

  * { box-sizing: border-box; }

  html { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 1.7vh, 18px) 12px;
    overflow-x: hidden;
    color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 12% 16%, rgba(255, 232, 130, 0.9) 0, rgba(255, 232, 130, 0) 25%),
      radial-gradient(circle at 88% 14%, rgba(151, 224, 255, 0.9) 0, rgba(151, 224, 255, 0) 27%),
      radial-gradient(circle at 75% 86%, rgba(208, 168, 255, 0.76) 0, rgba(208, 168, 255, 0) 30%),
      radial-gradient(circle at 16% 88%, rgba(255, 168, 202, 0.75) 0, rgba(255, 168, 202, 0) 25%),
      linear-gradient(135deg, #fff4c8 0%, #ffdceb 35%, #c7ecff 68%, #e2d2ff 100%);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
  }

  button { font: inherit; }
  button:focus-visible { outline: 3px solid #6b2e91; outline-offset: 2px; }

  .bg-decor {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
  }

  .bg-decor span {
    position: absolute;
    opacity: 0.18;
    filter: blur(0.2px);
    animation: drift 9s ease-in-out infinite alternate;
    text-shadow: 0 10px 24px rgba(102, 49, 126, 0.18);
  }

  .bg-decor span:nth-child(1) { left: 3%; top: 12%; font-size: clamp(36px, 6vw, 76px); animation-delay: -1s; }
  .bg-decor span:nth-child(2) { left: 9%; bottom: 10%; font-size: clamp(30px, 5vw, 64px); animation-delay: -4s; animation-duration: 11s; }
  .bg-decor span:nth-child(3) { right: 4%; top: 17%; font-size: clamp(34px, 5.5vw, 70px); animation-delay: -6s; animation-duration: 10s; }
  .bg-decor span:nth-child(4) { right: 9%; bottom: 8%; font-size: clamp(38px, 6.2vw, 80px); animation-delay: -2.5s; animation-duration: 12s; }
  .bg-decor span:nth-child(5) { left: 45%; top: 2%; font-size: clamp(22px, 3.6vw, 44px); animation-delay: -7s; animation-duration: 8s; }
  .bg-decor span:nth-child(6) { left: 76%; top: 55%; font-size: clamp(20px, 3vw, 38px); opacity: 0.12; animation-delay: -3s; }

  @keyframes drift {
    from { transform: translate3d(0, -8px, 0) rotate(-8deg) scale(0.96); }
    to   { transform: translate3d(10px, 14px, 0) rotate(9deg) scale(1.05); }
  }

  .game-shell {
    position: relative;
    z-index: 1;
    width: var(--board-size);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: clamp(7px, 1.35vh, 14px);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 44px;
    padding: 0 3px;
  }

  .top-actions {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: clamp(8px, 1.8vw, 13px);
    min-width: 0;
  }

  .logo {
    flex: 0 0 auto;
    width: clamp(38px, 6vw, 50px);
    height: clamp(38px, 6vw, 50px);
    display: grid;
    place-items: center;
    font-size: clamp(23px, 3.8vw, 32px);
    line-height: 1;
    border-radius: 35% 45% 38% 46%;
    background: rgba(255, 255, 255, 0.62);
    border: 2px solid rgba(255, 255, 255, 0.92);
    box-shadow: 0 8px 20px rgba(102, 54, 127, 0.16), inset 0 1px 0 #fff;
    transform: rotate(-8deg);
    animation: logoBob 3.6s ease-in-out infinite;
  }

  @keyframes logoBob {
    0%, 100% { transform: rotate(-8deg) translateY(0); }
    50% { transform: rotate(-2deg) translateY(-4px); }
  }

  .brand-text { min-width: 0; }

  h1 {
    margin: 0;
    color: #47205f;
    font-size: clamp(22px, 4.2vw, 34px);
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: 1.5px;
    white-space: nowrap;
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9), 0 6px 18px rgba(92, 41, 117, 0.12);
  }

  .subtitle {
    margin: 3px 0 0;
    color: var(--ink-soft);
    font-size: clamp(10px, 1.5vw, 12px);
    font-weight: 700;
    letter-spacing: 0.4px;
    white-space: nowrap;
  }

  .restart-btn,
  .music-btn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border: 2px solid rgba(255, 255, 255, 0.9);
    border-radius: 999px;
    color: #57296f;
    background: rgba(255, 255, 255, 0.56);
    box-shadow: 0 7px 18px rgba(100, 47, 125, 0.14), inset 0 1px 0 #fff;
    font-size: clamp(12px, 1.7vw, 14px);
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
  }

  .restart-btn .icon {
    display: inline-block;
    font-size: 1.25em;
    line-height: 0.8;
    transition: transform 0.35s ease;
  }

  .restart-btn:hover,
  .music-btn:hover {
    background: rgba(255, 255, 255, 0.88);
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(100, 47, 125, 0.18), inset 0 1px 0 #fff;
  }

  .restart-btn:hover .icon { transform: rotate(-180deg); }
  .restart-btn:active,
  .music-btn:active { transform: translateY(0) scale(0.97); }

  .music-btn {
    padding: 9px 12px;
    color: #712d64;
    background: linear-gradient(145deg, rgba(255, 252, 255, 0.82), rgba(255, 215, 235, 0.7));
  }

  .music-btn:hover {
    background: linear-gradient(145deg, #ffffff, #ffe2f1);
    box-shadow: 0 10px 22px rgba(139, 53, 109, 0.18), inset 0 1px 0 #fff;
  }

  .music-btn.is-playing {
    border-color: rgba(255, 255, 255, 0.98);
    box-shadow: 0 7px 18px rgba(139, 53, 109, 0.17), 0 0 0 3px rgba(255, 130, 184, 0.14), inset 0 1px 0 #fff;
  }

  .music-btn.is-off {
    color: rgba(87, 66, 103, 0.72);
    background: rgba(255, 255, 255, 0.4);
    box-shadow: 0 6px 15px rgba(100, 47, 125, 0.1), inset 0 1px 0 #fff;
  }

  .music-btn .music-icon {
    display: inline-block;
    font-size: 1.2em;
    line-height: 1;
    transition: filter 0.2s ease, opacity 0.2s ease;
  }

  .music-btn.is-off .music-icon {
    opacity: 0.65;
    filter: grayscale(1);
  }

  .equalizer {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    width: 13px;
    height: 14px;
    margin-left: 1px;
  }

  .equalizer i {
    display: block;
    width: 3px;
    height: 100%;
    border-radius: 3px;
    background: currentColor;
    opacity: 0.62;
    transform-origin: bottom;
    animation: equalizer 0.58s ease-in-out infinite alternate;
  }

  .equalizer i:nth-child(1) { height: 46%; animation-delay: -0.38s; }
  .equalizer i:nth-child(2) { height: 78%; animation-delay: -0.17s; }
  .equalizer i:nth-child(3) { height: 58%; animation-delay: -0.29s; }

  .music-btn:not(.is-playing) .equalizer i {
    animation-play-state: paused;
    opacity: 0.28;
  }

  .music-btn.is-off .equalizer { display: none; }

  @keyframes equalizer {
    from { transform: scaleY(0.3); }
    to   { transform: scaleY(1); }
  }

  .hud {
    display: grid;
    grid-template-columns: 1fr 0.82fr 1fr;
    gap: clamp(6px, 1.2vw, 11px);
  }

  .stat {
    position: relative;
    min-width: 0;
    overflow: hidden;
    padding: clamp(7px, 1.4vh, 12px) clamp(10px, 2.4vw, 18px);
    border: 2px solid rgba(255, 255, 255, 0.88);
    border-radius: clamp(16px, 2.6vw, 22px);
    box-shadow: 0 8px 22px rgba(94, 43, 116, 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    isolation: isolate;
  }

  .stat::after {
    content: "";
    position: absolute;
    width: 42%;
    height: 140%;
    top: -38%;
    right: -10%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.38);
    transform: rotate(20deg);
    z-index: -1;
  }

  .stat-score { background: linear-gradient(145deg, #fffbe0, #ffdc7a); }
  .stat-combo { background: linear-gradient(145deg, #ffeaf5, #ffb7d7); }
  .stat-moves { background: linear-gradient(145deg, #e9faff, #a9ddf7); transition: background 0.3s ease; }

  .stat-label {
    color: rgba(72, 34, 95, 0.6);
    font-size: clamp(9px, 1.35vw, 11px);
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: 1.5px;
    white-space: nowrap;
  }

  .stat-value {
    display: block;
    margin-top: 1px;
    color: #48225f;
    font-size: clamp(21px, 4.2vw, 35px);
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
    transform-origin: left center;
  }

  .stat-combo .stat-value {
    text-align: center;
    color: #b92f76;
    transform-origin: center;
  }

  .stat-moves .stat-value { color: #175b7a; }
  .stat-moves .unit { margin-left: 2px; font-size: 0.42em; font-weight: 800; opacity: 0.7; letter-spacing: 0; }

  .stat-moves.low { background: linear-gradient(145deg, #ffe9ec, #ff9fb0); }
  .stat-moves.low .stat-value { color: #b51245; }
  .stat-moves.low .stat-label { color: rgba(140, 20, 55, 0.68); }

  .stat-value.bump { animation: valueBump 0.32s cubic-bezier(0.2, 0.8, 0.3, 1); }

  @keyframes valueBump {
    0% { transform: scale(1); }
    42% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  .board-wrap {
    position: relative;
    width: var(--board-size);
    height: var(--board-size);
    border-radius: clamp(22px, 4.2vw, 34px);
    isolation: isolate;
  }

  .board-wrap::before {
    content: "";
    position: absolute;
    inset: 3% 5% -2%;
    z-index: -2;
    border-radius: 50%;
    background: rgba(104, 51, 139, 0.3);
    filter: blur(28px);
    transform: translateY(15px);
  }

  .board {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: var(--gap);
    padding: calc(var(--gap) * 1.45);
    border: clamp(4px, 0.8vmin, 7px) solid rgba(255, 255, 255, 0.88);
    border-radius: inherit;
    background:
      linear-gradient(145deg, rgba(255, 255, 255, 0.48), rgba(255, 239, 250, 0.3)),
      linear-gradient(160deg, rgba(255, 189, 218, 0.2), rgba(160, 212, 255, 0.18));
    box-shadow:
      0 20px 50px rgba(91, 43, 118, 0.25),
      0 4px 0 rgba(255, 255, 255, 0.55) inset,
      0 0 0 1px rgba(255, 255, 255, 0.42) inset;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    touch-action: manipulation;
    user-select: none;
  }

  .board.invalid { animation: boardShake 0.34s ease; }

  @keyframes boardShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px) rotate(-0.35deg); }
    45% { transform: translateX(5px) rotate(0.35deg); }
    70% { transform: translateX(-3px); }
    88% { transform: translateX(2px); }
  }

  .cell {
    position: relative;
    min-width: 0;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: var(--cell-radius);
    background: rgba(255, 255, 255, 0.4);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.85), inset 0 -2px 4px rgba(112, 60, 135, 0.06);
    cursor: pointer;
    transition: transform 0.12s ease, background 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .cell[data-fruit="0"] { background: linear-gradient(145deg, rgba(255, 221, 222, 0.82), rgba(255, 177, 183, 0.48)); }
  .cell[data-fruit="1"] { background: linear-gradient(145deg, rgba(255, 228, 179, 0.85), rgba(255, 189, 102, 0.48)); }
  .cell[data-fruit="2"] { background: linear-gradient(145deg, rgba(255, 249, 185, 0.88), rgba(245, 218, 91, 0.48)); }
  .cell[data-fruit="3"] { background: linear-gradient(145deg, rgba(230, 211, 255, 0.88), rgba(183, 146, 242, 0.48)); }
  .cell[data-fruit="4"] { background: linear-gradient(145deg, rgba(207, 250, 218, 0.88), rgba(135, 221, 174, 0.48)); }
  .cell[data-fruit="5"] { background: linear-gradient(145deg, rgba(205, 246, 217, 0.88), rgba(148, 218, 160, 0.4)); }

  @media (hover: hover) {
    .cell:hover {
      z-index: 2;
      transform: translateY(-2px) scale(1.035);
      filter: brightness(1.035);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 5px 12px rgba(90, 43, 112, 0.12);
    }
  }

  .cell.selected {
    z-index: 5;
    background: linear-gradient(145deg, #fffde7, #ffe78a) !important;
    box-shadow: 0 0 0 3px #ffd83d, 0 0 0 6px rgba(255, 243, 170, 0.55), 0 8px 20px rgba(149, 97, 0, 0.22);
    transform: scale(1.07);
    animation: selectedPulse 0.72s ease-in-out infinite alternate;
  }

  @keyframes selectedPulse {
    from { transform: scale(1.04); filter: brightness(1); }
    to   { transform: scale(1.09); filter: brightness(1.07); }
  }

  .fruit {
    display: block;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
    font-size: var(--fruit-size);
    line-height: 1;
    pointer-events: none;
    transform-origin: 50% 56%;
    filter: drop-shadow(0 2px 2px rgba(88, 38, 101, 0.16));
    will-change: transform, opacity;
  }

  .cell.swapped .fruit { animation: swapPop 0.26s cubic-bezier(0.2, 0.9, 0.35, 1); }

  @keyframes swapPop {
    0% { transform: scale(0.82) rotate(-7deg); opacity: 0.6; }
    58% { transform: scale(1.12) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }

  .cell.matched { z-index: 4; background: #fffef5 !important; animation: tileFlash 0.38s ease forwards; }

  .cell.matched .fruit {
    animation: fruitPop 0.38s cubic-bezier(0.25, 0.8, 0.35, 1) forwards;
    filter: drop-shadow(0 0 14px rgba(255, 227, 93, 0.95));
  }

  @keyframes fruitPop {
    0% { transform: scale(1); opacity: 1; }
    38% { transform: scale(1.32) rotate(8deg); opacity: 1; }
    100% { transform: scale(0.05) rotate(-12deg); opacity: 0; }
  }

  @keyframes tileFlash {
    0% { filter: brightness(1); }
    35% { filter: brightness(1.26); box-shadow: 0 0 26px rgba(255, 225, 90, 0.85); }
    100% { filter: brightness(1.4); }
  }

  .cell.drop-in .fruit { animation: fruitDrop 0.32s cubic-bezier(0.2, 0.85, 0.35, 1.12); }

  @keyframes fruitDrop {
    0% { transform: translateY(-18px) scale(0.8); opacity: 0.25; }
    65% { transform: translateY(2px) scale(1.04); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  .board.intro .cell .fruit {
    animation: introFruit 0.48s cubic-bezier(0.18, 0.89, 0.32, 1.28) both;
    animation-delay: calc(var(--i) * 4ms);
  }

  @keyframes introFruit {
    0% { transform: scale(0) rotate(-18deg); opacity: 0; }
    70% { transform: scale(1.1) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .board-wrap.shuffling .cell {
    animation: shuffleWiggle 0.42s ease-in-out infinite alternate;
    animation-delay: calc(var(--i) * -7ms);
  }

  @keyframes shuffleWiggle {
    from { transform: rotate(-3deg) scale(0.94); }
    to   { transform: rotate(3deg) scale(1.03); }
  }

  .fx-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    overflow: visible;
  }

  .score-float {
    position: absolute;
    z-index: 21;
    display: block;
    transform: translate(-50%, -50%);
    color: #fff34d;
    font-size: clamp(16px, 2.7vw, 24px);
    font-weight: 900;
    letter-spacing: 0.5px;
    line-height: 1;
    white-space: nowrap;
    -webkit-text-stroke: 1px rgba(102, 44, 28, 0.38);
    text-shadow: 0 2px 0 #ff9e26, 0 4px 10px rgba(94, 46, 12, 0.32);
    animation: scoreFloat 0.96s cubic-bezier(0.16, 0.8, 0.4, 1) forwards;
  }

  .score-float.hot {
    color: #fff;
    font-size: clamp(19px, 3.2vw, 28px);
    text-shadow: 0 2px 0 #ff4f92, 0 0 14px rgba(255, 84, 154, 0.85);
    -webkit-text-stroke-color: rgba(147, 19, 83, 0.42);
  }

  @keyframes scoreFloat {
    0% { opacity: 0; transform: translate(-50%, -15%) scale(0.62); }
    22% { opacity: 1; transform: translate(-50%, -70%) scale(1.18); }
    100% { opacity: 0; transform: translate(-50%, -260%) scale(0.96); }
  }

  .combo-float {
    position: absolute;
    left: 50%;
    top: 44%;
    z-index: 22;
    transform: translate(-50%, -50%);
    padding: 7px 18px;
    border: 2px solid rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    color: #fff;
    background: linear-gradient(135deg, #ff5d9e, #ff9a48);
    box-shadow: 0 8px 24px rgba(208, 54, 128, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    font-size: clamp(15px, 2.6vw, 23px);
    font-weight: 900;
    letter-spacing: 1px;
    white-space: nowrap;
    text-shadow: 0 2px 0 rgba(137, 38, 73, 0.35);
    animation: comboFloat 0.85s cubic-bezier(0.16, 0.8, 0.4, 1) forwards;
  }

  @keyframes comboFloat {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(-8deg); }
    25% { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(2deg); }
    72% { opacity: 1; transform: translate(-50%, -65%) scale(1) rotate(0); }
    100% { opacity: 0; transform: translate(-50%, -110%) scale(0.9); }
  }

  .toast {
    position: absolute;
    top: -15px;
    left: 50%;
    z-index: 30;
    max-width: 94%;
    padding: 9px 18px;
    border: 2px solid rgba(255, 255, 255, 0.42);
    border-radius: 999px;
    color: #fff;
    background: rgba(66, 28, 87, 0.92);
    box-shadow: 0 9px 24px rgba(63, 23, 84, 0.26);
    font-size: clamp(11px, 1.8vw, 14px);
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: 0.3px;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -10px) scale(0.96);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  .footer {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 1px 4px 0;
    color: rgba(65, 30, 85, 0.62);
    font-size: clamp(10px, 1.45vw, 12px);
    font-weight: 700;
    letter-spacing: 0.2px;
    text-align: center;
  }

  .footer .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(94, 42, 117, 0.35);
  }

  .gameover {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(55, 22, 75, 0.52);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    opacity: 0;
    transition: opacity 0.24s ease;
  }

  .gameover[hidden] { display: none; }
  .gameover.show { opacity: 1; }

  .overlay-card {
    position: relative;
    width: min(90vw, 390px);
    overflow: hidden;
    padding: clamp(24px, 5vw, 34px) clamp(20px, 5vw, 30px) clamp(22px, 4vw, 28px);
    border: 3px solid rgba(255, 255, 255, 0.92);
    border-radius: clamp(24px, 5vw, 34px);
    background: linear-gradient(155deg, #fffdf3 0%, #fff3dc 42%, #ffe2f0 100%);
    box-shadow: 0 28px 80px rgba(47, 16, 68, 0.35), inset 0 1px 0 #fff;
    text-align: center;
    transform: translateY(18px) scale(0.88);
    transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.1);
  }

  .gameover.show .overlay-card { transform: translateY(0) scale(1); }

  .overlay-card::before,
  .overlay-card::after {
    content: "";
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255, 214, 84, 0.22);
    filter: blur(6px);
  }

  .overlay-card::before { top: -60px; left: -40px; }
  .overlay-card::after { right: -50px; bottom: -70px; background: rgba(255, 133, 188, 0.2); }

  .overlay-fruit {
    position: relative;
    z-index: 1;
    display: inline-block;
    font-size: clamp(48px, 11vw, 68px);
    line-height: 1;
    filter: drop-shadow(0 7px 10px rgba(113, 48, 70, 0.18));
    animation: trophyBob 1.5s ease-in-out infinite;
  }

  @keyframes trophyBob {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }

  .overlay-kicker {
    position: relative;
    z-index: 1;
    margin: 14px 0 3px;
    color: #b73d78;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
  }

  .overlay-title {
    position: relative;
    z-index: 1;
    margin: 0;
    color: #48225f;
    font-size: clamp(25px, 5vw, 34px);
    font-weight: 900;
    letter-spacing: 1px;
  }

  .overlay-message {
    position: relative;
    z-index: 1;
    min-height: 20px;
    margin: 7px 0 18px;
    color: rgba(72, 34, 95, 0.64);
    font-size: 13px;
    font-weight: 700;
  }

  .final-panel {
    position: relative;
    z-index: 1;
    margin-bottom: 20px;
    padding: 12px 18px 14px;
    border: 2px solid rgba(255, 255, 255, 0.92);
    border-radius: 21px;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.74), rgba(255, 240, 185, 0.64));
    box-shadow: inset 0 1px 0 #fff, 0 7px 18px rgba(126, 78, 40, 0.09);
  }

  .final-label {
    color: rgba(72, 34, 95, 0.58);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2px;
  }

  .final-score {
    display: block;
    margin-top: 1px;
    color: #e4572b;
    font-size: clamp(38px, 9vw, 54px);
    font-weight: 900;
    line-height: 1.06;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 0 #fff, 0 5px 14px rgba(221, 95, 44, 0.18);
  }

  .again-btn {
    position: relative;
    z-index: 1;
    width: 100%;
    padding: 14px 20px;
    border: 2px solid rgba(255, 255, 255, 0.7);
    border-radius: 16px;
    color: #fff;
    background: linear-gradient(135deg, #ff6a9e 0%, #ff8b5c 55%, #ffc13c 100%);
    box-shadow: 0 9px 0 #d34b76, 0 14px 25px rgba(194, 64, 111, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  .again-btn:hover { filter: brightness(1.04); transform: translateY(-2px); box-shadow: 0 11px 0 #d34b76, 0 17px 28px rgba(194, 64, 111, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
  .again-btn:active { transform: translateY(6px); box-shadow: 0 3px 0 #d34b76, 0 6px 14px rgba(194, 64, 111, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.5); }

  @media (max-width: 480px) {
    .top-actions { gap: 5px; }
    .restart-btn,
    .music-btn { width: 42px; height: 42px; justify-content: center; padding: 0; }
    .restart-btn span { display: none; }
    .restart-btn .icon { font-size: 21px; }
    .music-btn .music-label,
    .music-btn .equalizer { display: none; }
    .music-btn .music-icon { font-size: 20px; }
    .subtitle { display: none; }
    .brand { gap: 8px; }
    .hud { gap: 5px; }
    .stat { padding: 7px 9px; border-width: 1.5px; border-radius: 15px; }
    .stat-label { letter-spacing: 0.8px; }
    .footer { gap: 5px; }
  }

  @media (max-height: 580px) {
    .subtitle, .footer { display: none; }
    .topbar { min-height: 34px; }
    .logo { width: 34px; height: 34px; font-size: 21px; }
    .hud .stat { padding-top: 6px; padding-bottom: 6px; }
    .hud .stat-value { font-size: clamp(19px, 3.6vw, 28px); }
    .game-shell { gap: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span>🍓</span>
    <span>🍋</span>
    <span>🍇</span>
    <span>🍉</span>
    <span>🥝</span>
    <span>🍊</span>
  </div>

  <main class="game-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">🍉</div>
        <div class="brand-text">
          <h1>水果消消乐</h1>
          <p class="subtitle">交换相邻水果，三个连成线</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="music-btn" class="music-btn is-on" type="button" aria-label="关闭游戏音乐" aria-pressed="true" title="关闭游戏音乐">
          <span class="music-icon" id="music-icon" aria-hidden="true">🎵</span>
          <span class="music-label">音乐</span>
          <span class="equalizer" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
        <button id="restart-btn" class="restart-btn" type="button" title="重新开始">
          <span class="icon" aria-hidden="true">↻</span><span>重新开始</span>
        </button>
      </div>
    </header>

    <section class="hud" aria-label="游戏状态">
      <div class="stat stat-score" id="score-card">
        <div class="stat-label">得 分</div>
        <span class="stat-value" id="score-value">0</span>
      </div>
      <div class="stat stat-combo" id="combo-card" aria-label="当前连击">
        <div class="stat-label">连 击</div>
        <span class="stat-value" id="combo-value">×1</span>
      </div>
      <div class="stat stat-moves" id="moves-card">
        <div class="stat-label">剩余步数</div>
        <span class="stat-value"><span id="moves-value">30</span><span class="unit">步</span></span>
      </div>
    </section>

    <section class="board-wrap" id="board-wrap">
      <div class="board" id="board" aria-label="10乘10水果棋盘"></div>
      <div class="fx-layer" id="fx-layer" aria-hidden="true"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>

    <footer class="footer" aria-hidden="true">
      <span>🍬 三个或更多相同水果即可消除</span>
      <span class="dot"></span>
      <span>连击有额外加分</span>
    </footer>
  </main>

  <div class="gameover" id="gameover" role="dialog" aria-modal="true" aria-labelledby="overlay-title" hidden>
    <div class="overlay-card">
      <div class="overlay-fruit" aria-hidden="true">🍉</div>
      <p class="overlay-kicker">30 步挑战完成</p>
      <h2 class="overlay-title" id="overlay-title">本轮结束</h2>
      <p class="overlay-message" id="overlay-message">再来一局，冲击更高分！</p>
      <div class="final-panel">
        <div class="final-label">本局得分</div>
        <span class="final-score" id="final-score">0</span>
      </div>
      <button class="again-btn" id="again-btn" type="button">再来一局</button>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const SIZE = 10;
  const START_MOVES = 30;
  const POINTS_PER_FRUIT = 10;
  const TYPES = [
    { emoji: '🍎', name: '苹果' },
    { emoji: '🍊', name: '橙子' },
    { emoji: '🍋', name: '柠檬' },
    { emoji: '🍇', name: '葡萄' },
    { emoji: '🍉', name: '西瓜' },
    { emoji: '🥝', name: '猕猴桃' }
  ];

  const boardEl = document.getElementById('board');
  const boardWrapEl = document.getElementById('board-wrap');
  const fxLayerEl = document.getElementById('fx-layer');
  const toastEl = document.getElementById('toast');
  const scoreValueEl = document.getElementById('score-value');
  const movesValueEl = document.getElementById('moves-value');
  const movesCardEl = document.getElementById('moves-card');
  const comboValueEl = document.getElementById('combo-value');
  const scoreCardEl = document.getElementById('score-card');
  const comboCardEl = document.getElementById('combo-card');
  const musicBtn = document.getElementById('music-btn');
  const musicIconEl = document.getElementById('music-icon');
  const restartBtn = document.getElementById('restart-btn');
  const gameoverEl = document.getElementById('gameover');
  const finalScoreEl = document.getElementById('final-score');
  const overlayMessageEl = document.getElementById('overlay-message');
  const againBtn = document.getElementById('again-btn');

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cells = [];
  const fruitSpans = [];

  let board = [];
  let selected = -1;
  let busy = false;
  let gameOver = false;
  let score = 0;
  let moves = START_MOVES;
  let session = 0;
  let toastTimer = 0;
  let introTimer = 0;
  let comboTimer = 0;

  const randomType = () => Math.floor(Math.random() * TYPES.length);
  const indexOf = (row, col) => row * SIZE + col;
  const rowOf = (index) => Math.floor(index / SIZE);
  const colOf = (index) => index % SIZE;
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, reducedMotion ? Math.min(ms, 60) : ms));

  function isAdjacent(a, b) {
    return Math.abs(rowOf(a) - rowOf(b)) + Math.abs(colOf(a) - colOf(b)) === 1;
  }

  function buildGrid() {
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < SIZE * SIZE; i++) {
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cell';
      cell.dataset.index = String(i);
      cell.style.setProperty('--i', String(i));
      cell.setAttribute('aria-label', `第 ${rowOf(i) + 1} 行第 ${colOf(i) + 1} 列`);

      const fruit = document.createElement('span');
      fruit.className = 'fruit';
      fruit.setAttribute('aria-hidden', 'true');
      cell.appendChild(fruit);

      fragment.appendChild(cell);
      cells.push(cell);
      fruitSpans.push(fruit);
    }
    boardEl.appendChild(fragment);
  }

  function findMatchSet(data) {
    const matched = new Set();

    for (let r = 0; r < SIZE; r++) {
      let start = 0;
      for (let c = 1; c <= SIZE; c++) {
        if (c < SIZE && data[indexOf(r, c)] === data[indexOf(r, c - 1)]) continue;
        if (c - start >= 3) {
          for (let k = start; k < c; k++) matched.add(indexOf(r, k));
        }
        start = c;
      }
    }

    for (let c = 0; c < SIZE; c++) {
      let start = 0;
      for (let r = 1; r <= SIZE; r++) {
        if (r < SIZE && data[indexOf(r, c)] === data[indexOf(r - 1, c)]) continue;
        if (r - start >= 3) {
          for (let k = start; k < r; k++) matched.add(indexOf(k, c));
        }
        start = r;
      }
    }

    return matched;
  }

  function swapValues(a, b) {
    const temp = board[a];
    board[a] = board[b];
    board[b] = temp;
  }

  function findPossibleMove(data) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const i = indexOf(r, c);

        if (c < SIZE - 1 && data[i] !== data[i + 1]) {
          const temp = data[i];
          data[i] = data[i + 1];
          data[i + 1] = temp;
          const possible = findMatchSet(data).size > 0;
          data[i + 1] = data[i];
          data[i] = temp;
          if (possible) return { a: i, b: i + 1 };
        }

        if (r < SIZE - 1 && data[i] !== data[i + SIZE]) {
          const temp = data[i];
          data[i] = data[i + SIZE];
          data[i + SIZE] = temp;
          const possible = findMatchSet(data).size > 0;
          data[i + SIZE] = data[i];
          data[i] = temp;
          if (possible) return { a: i, b: i + SIZE };
        }
      }
    }
    return null;
  }

  function generateBoard() {
    for (let attempt = 0; attempt < 240; attempt++) {
      const next = new Array(SIZE * SIZE);

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const i = indexOf(r, c);
          const banned = new Set();
          if (c >= 2 && next[i - 1] === next[i - 2]) banned.add(next[i - 1]);
          if (r >= 2 && next[i - SIZE] === next[i - 2 * SIZE]) banned.add(next[i - SIZE]);

          const options = [];
          for (let type = 0; type < TYPES.length; type++) {
            if (!banned.has(type)) options.push(type);
          }
          next[i] = options[Math.floor(Math.random() * options.length)];
        }
      }

      if (findPossibleMove(next)) return next;
    }

    // Extremely defensive fallback: cycle the fruit types so no three line up.
    const fallback = new Array(SIZE * SIZE);
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        fallback[indexOf(r, c)] = (r * 3 + c * 2 + Math.floor(r / 2)) % TYPES.length;
      }
    }
    return fallback;
  }

  function updateCellLabel(i, type) {
    const fruitName = type === null || type === undefined ? '空位' : TYPES[type].name;
    cells[i].setAttribute('aria-label', `第 ${rowOf(i) + 1} 行第 ${colOf(i) + 1} 列，${fruitName}`);
  }

  function renderBoard(animatedCells = []) {
    const animated = new Set(animatedCells);

    for (let i = 0; i < board.length; i++) {
      const type = board[i];
      const cell = cells[i];
      const fruit = fruitSpans[i];

      if (type === null || type === undefined) {
        fruit.textContent = '';
        delete cell.dataset.fruit;
        updateCellLabel(i, null);
        continue;
      }

      fruit.textContent = TYPES[type].emoji;
      cell.dataset.fruit = String(type);
      updateCellLabel(i, type);
      cell.classList.toggle('selected', i === selected);
    }

    animated.forEach((i) => {
      const cell = cells[i];
      if (!cell) return;
      cell.classList.remove('drop-in');
      void cell.offsetWidth;
      cell.classList.add('drop-in');
      window.setTimeout(() => cell.classList.remove('drop-in'), reducedMotion ? 120 : 430);
    });
  }

  function syncSelection() {
    for (let i = 0; i < cells.length; i++) {
      cells[i].classList.toggle('selected', i === selected);
    }
  }

  function bump(element) {
    element.classList.remove('bump');
    void element.offsetWidth;
    element.classList.add('bump');
    window.setTimeout(() => element.classList.remove('bump'), 360);
  }

  function updateHud() {
    scoreValueEl.textContent = score.toLocaleString('zh-CN');
    movesValueEl.textContent = String(moves);
    movesCardEl.classList.toggle('low', moves <= 5);
    comboValueEl.textContent = '×' + Math.max(1, Number(comboValueEl.dataset.level || 1));
  }

  function setCombo(level) {
    comboValueEl.dataset.level = String(Math.max(1, level));
    comboValueEl.textContent = '×' + Math.max(1, level);
    if (level > 1) bump(comboValueEl);
  }

  function showToast(message, duration = 1500) {
    window.clearTimeout(toastTimer);
    toastEl.textContent = message;
    toastEl.classList.add('show');
    if (duration > 0) {
      toastTimer = window.setTimeout(() => toastEl.classList.remove('show'), duration);
    }
  }

  function hideToast() {
    window.clearTimeout(toastTimer);
    toastEl.classList.remove('show');
  }

  // Synthesized background music: no audio files, network, or external libraries.
  const music = (() => {
    const BPM = 112;
    const STEP_DURATION = 60 / BPM / 2;
    const LOOP_STEPS = 32;
    const MUSIC_LEVEL = 0.72;
    const MELODY = [
      76, null, 79, 81, 79, 76, 74, 72,
      69, null, 72, 76, 74, 72, 69, 67,
      65, null, 69, 72, 77, 76, 72, 69,
      67, null, 71, 74, 79, 77, 74, null
    ];
    const BASS_ROOTS = [48, 45, 41, 43];
    const BASS_FIFTHS = [55, 52, 48, 50];
    const CHORDS = [
      [60, 64, 67],
      [57, 60, 64],
      [53, 57, 60],
      [55, 59, 62]
    ];

    let context = null;
    let masterGain = null;
    let musicGain = null;
    let noiseBuffer = null;
    let schedulerTimer = 0;
    let nextNoteTime = 0;
    let currentStep = 0;
    let enabled = true;
    let started = false;
    let running = false;
    let pausedByVisibility = false;

    const midiToFreq = (midi) => 440 * Math.pow(2, (midi - 69) / 12);

    function ensureContext() {
      if (context) return;

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) throw new Error('Web Audio API is not supported');

      context = new AudioContextClass();

      const compressor = context.createDynamicsCompressor();
      compressor.threshold.value = -18;
      compressor.knee.value = 18;
      compressor.ratio.value = 4;
      compressor.attack.value = 0.004;
      compressor.release.value = 0.24;

      masterGain = context.createGain();
      masterGain.gain.value = 0.7;

      musicGain = context.createGain();
      musicGain.gain.value = 0.0001;
      musicGain.connect(compressor);
      compressor.connect(masterGain);
      masterGain.connect(context.destination);

      const bufferLength = Math.floor(context.sampleRate * 0.08);
      noiseBuffer = context.createBuffer(1, bufferLength, context.sampleRate);
      const noiseData = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferLength; i++) {
        noiseData[i] = Math.random() * 2 - 1;
      }
    }

    function playTone(frequency, when, duration, type, volume) {
      const oscillator = context.createOscillator();
      const envelope = context.createGain();
      const end = when + Math.max(duration, 0.06);

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, when);
      envelope.gain.setValueAtTime(0.0001, when);
      envelope.gain.exponentialRampToValueAtTime(Math.max(volume, 0.0002), when + 0.018);
      envelope.gain.exponentialRampToValueAtTime(0.0001, end);

      oscillator.connect(envelope);
      envelope.connect(musicGain);
      oscillator.start(when);
      oscillator.stop(end + 0.05);
    }

    function playKick(when) {
      const oscillator = context.createOscillator();
      const envelope = context.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(150, when);
      oscillator.frequency.exponentialRampToValueAtTime(46, when + 0.12);
      envelope.gain.setValueAtTime(0.0001, when);
      envelope.gain.exponentialRampToValueAtTime(0.09, when + 0.008);
      envelope.gain.exponentialRampToValueAtTime(0.0001, when + 0.2);

      oscillator.connect(envelope);
      envelope.connect(musicGain);
      oscillator.start(when);
      oscillator.stop(when + 0.24);
    }

    function playHat(when) {
      if (!noiseBuffer) return;

      const source = context.createBufferSource();
      const filter = context.createBiquadFilter();
      const envelope = context.createGain();

      source.buffer = noiseBuffer;
      filter.type = 'highpass';
      filter.frequency.value = 6800;
      envelope.gain.setValueAtTime(0.011, when);
      envelope.gain.exponentialRampToValueAtTime(0.0001, when + 0.045);

      source.connect(filter);
      filter.connect(envelope);
      envelope.connect(musicGain);
      source.start(when);
      source.stop(when + 0.06);
    }

    function scheduleStep(step, when) {
      const bar = Math.floor(step / 8);
      const beat = step % 8;
      const melodyNote = MELODY[step];

      if (melodyNote !== null) {
        playTone(midiToFreq(melodyNote), when, STEP_DURATION * 1.35, 'triangle', 0.055);
      }

      if (beat === 0 || beat === 4) {
        playTone(midiToFreq(BASS_ROOTS[bar]), when, STEP_DURATION * 3.7, 'sine', 0.095);
        for (let i = 0; i < CHORDS[bar].length; i++) {
          playTone(midiToFreq(CHORDS[bar][i]), when + i * 0.012, STEP_DURATION * 1.65, 'triangle', 0.014);
        }
        playKick(when);
      } else if (beat === 2 || beat === 6) {
        playTone(midiToFreq(BASS_FIFTHS[bar]), when, STEP_DURATION * 1.3, 'sine', 0.045);
      }

      if (beat % 2 === 1) playHat(when);
    }

    function scheduler() {
      if (!running || !context) return;
      while (nextNoteTime < context.currentTime + 0.4) {
        scheduleStep(currentStep, nextNoteTime);
        currentStep = (currentStep + 1) % LOOP_STEPS;
        nextNoteTime += STEP_DURATION;
      }
    }

    function updateButton() {
      musicBtn.classList.toggle('is-on', enabled);
      musicBtn.classList.toggle('is-off', !enabled);
      musicBtn.classList.toggle('is-playing', enabled && running);
      musicBtn.setAttribute('aria-pressed', String(enabled));

      const label = enabled ? '关闭游戏音乐' : '开启游戏音乐';
      musicBtn.setAttribute('aria-label', label);
      musicBtn.title = label;
      musicIconEl.textContent = enabled ? '🎵' : '🔇';
    }

    async function startPlayback() {
      if (!enabled) return false;

      try {
        ensureContext();
        if (context.state === 'suspended') await context.resume();
        if (!enabled) return false;
        if (context.state !== 'running') {
          enabled = false;
          running = false;
          updateButton();
          return false;
        }

        started = true;
        if (running) {
          updateButton();
          return true;
        }

        running = true;
        currentStep = 0;
        nextNoteTime = context.currentTime + 0.08;

        const now = context.currentTime;
        musicGain.gain.cancelScheduledValues(now);
        musicGain.gain.setValueAtTime(Math.max(0.0001, musicGain.gain.value), now);
        musicGain.gain.linearRampToValueAtTime(MUSIC_LEVEL, now + 0.6);

        scheduler();
        window.clearInterval(schedulerTimer);
        schedulerTimer = window.setInterval(scheduler, 90);
        updateButton();
        return true;
      } catch (error) {
        running = false;
        enabled = false;
        window.clearInterval(schedulerTimer);
        schedulerTimer = 0;
        updateButton();
        return false;
      }
    }

    function stopPlayback() {
      running = false;
      window.clearInterval(schedulerTimer);
      schedulerTimer = 0;

      if (context && musicGain) {
        const now = context.currentTime;
        musicGain.gain.cancelScheduledValues(now);
        musicGain.gain.setValueAtTime(Math.max(0.0001, musicGain.gain.value), now);
        musicGain.gain.linearRampToValueAtTime(0.0001, now + 0.18);
      }
      updateButton();
    }

    function toggle() {
      enabled = !enabled;
      if (enabled) {
        startPlayback();
      } else {
        stopPlayback();
      }
      updateButton();
      return enabled;
    }

    function removeGestureListeners() {
      document.removeEventListener('pointerdown', handleFirstGesture, true);
      document.removeEventListener('keydown', handleFirstGesture, true);
    }

    function handleFirstGesture(event) {
      if (!enabled || running) {
        removeGestureListeners();
        return;
      }

      const target = event.target;
      if (target instanceof Element && target.closest('#music-btn')) return;

      startPlayback();
      removeGestureListeners();
    }

    function armAutoStart() {
      document.addEventListener('pointerdown', handleFirstGesture, { capture: true, passive: true });
      document.addEventListener('keydown', handleFirstGesture, true);
    }

    function handleVisibility() {
      if (document.hidden) {
        if (running) {
          pausedByVisibility = true;
          stopPlayback();
        }
      } else if (pausedByVisibility) {
        pausedByVisibility = false;
        if (enabled && started) startPlayback();
      }
    }

    updateButton();

    return {
      armAutoStart,
      handleVisibility,
      toggle,
      getState() {
        return {
          enabled,
          started,
          running,
          contextState: context ? context.state : 'none'
        };
      }
    };
  })();

  function componentsOf(indices) {
    const remaining = new Set(indices);
    const groups = [];

    for (const start of indices) {
      if (!remaining.has(start)) continue;
      const group = [];
      const queue = [start];
      remaining.delete(start);

      while (queue.length) {
        const current = queue.pop();
        group.push(current);
        const r = rowOf(current);
        const c = colOf(current);
        const neighbors = [];
        if (c > 0) neighbors.push(current - 1);
        if (c < SIZE - 1) neighbors.push(current + 1);
        if (r > 0) neighbors.push(current - SIZE);
        if (r < SIZE - 1) neighbors.push(current + SIZE);

        for (const neighbor of neighbors) {
          if (remaining.has(neighbor)) {
            remaining.delete(neighbor);
            queue.push(neighbor);
          }
        }
      }
      groups.push(group);
    }
    return groups;
  }

  function showScoreFloat(group, points, cascade) {
    const boardRect = boardEl.getBoundingClientRect();
    if (!boardRect.width) return;

    let x = 0;
    let y = 0;
    for (const i of group) {
      const rect = cells[i].getBoundingClientRect();
      x += rect.left + rect.width / 2;
      y += rect.top + rect.height / 2;
    }
    x = x / group.length - boardRect.left;
    y = y / group.length - boardRect.top;

    const floatEl = document.createElement('div');
    floatEl.className = 'score-float' + (cascade > 1 ? ' hot' : '');
    floatEl.textContent = '+' + points;
    floatEl.style.left = x + 'px';
    floatEl.style.top = y + 'px';
    fxLayerEl.appendChild(floatEl);
    window.setTimeout(() => floatEl.remove(), reducedMotion ? 160 : 1000);
  }

  function showComboFloat(level) {
    const el = document.createElement('div');
    el.className = 'combo-float';
    el.textContent = '连击 ×' + level;
    fxLayerEl.appendChild(el);
    window.setTimeout(() => el.remove(), reducedMotion ? 160 : 900);
  }

  function animateSwapCells(indices) {
    for (const i of indices) {
      const cell = cells[i];
      cell.classList.remove('swapped');
      void cell.offsetWidth;
      cell.classList.add('swapped');
      window.setTimeout(() => cell.classList.remove('swapped'), 300);
    }
  }

  function collapseAndRefill() {
    const changed = new Set();

    for (let c = 0; c < SIZE; c++) {
      let writeRow = SIZE - 1;

      for (let r = SIZE - 1; r >= 0; r--) {
        const from = indexOf(r, c);
        if (board[from] === null) continue;

        const to = indexOf(writeRow, c);
        if (to !== from) {
          board[to] = board[from];
          changed.add(to);
        }
        writeRow--;
      }

      for (let r = writeRow; r >= 0; r--) {
        const to = indexOf(r, c);
        board[to] = randomType();
        changed.add(to);
      }
    }

    return changed;
  }

  async function resolveMatches(token) {
    let cascade = 0;

    while (token === session) {
      const matched = findMatchSet(board);
      if (matched.size === 0) break;

      cascade++;
      setCombo(cascade);
      if (cascade > 1) showComboFloat(cascade);

      const gained = matched.size * POINTS_PER_FRUIT * cascade;
      score += gained;
      updateHud();
      bump(scoreValueEl);

      const groups = componentsOf(matched);
      for (const group of groups) {
        showScoreFloat(group, group.length * POINTS_PER_FRUIT * cascade, cascade);
      }

      for (const i of matched) cells[i].classList.add('matched');
      await wait(390);
      if (token !== session) return;

      for (const i of matched) {
        cells[i].classList.remove('matched');
        board[i] = null;
      }

      const changed = collapseAndRefill();
      renderBoard(Array.from(changed));
      await wait(290);
    }

    if (token === session) {
      window.clearTimeout(comboTimer);
      comboTimer = window.setTimeout(() => {
        if (token === session && !busy) setCombo(1);
      }, 1600);
    }
  }

  async function autoShuffle(token) {
    boardWrapEl.classList.add('shuffling');
    showToast('没有可用步数，正在重新洗牌…', 0);
    await wait(680);
    if (token !== session) return;

    board = generateBoard();
    selected = -1;
    syncSelection();
    renderBoard();
    boardWrapEl.classList.remove('shuffling');
    animateIntro();
    showToast('洗牌完成，继续挑战！', 1200);
    await wait(260);
  }

  function animateIntro() {
    window.clearTimeout(introTimer);
    boardEl.classList.remove('intro');
    void boardEl.offsetWidth;
    boardEl.classList.add('intro');
    introTimer = window.setTimeout(() => boardEl.classList.remove('intro'), 1000);
  }

  async function attemptSwap(a, b) {
    if (busy || gameOver) return;

    busy = true;
    const token = session;
    window.clearTimeout(comboTimer);

    swapValues(a, b);
    renderBoard();
    animateSwapCells([a, b]);
    await wait(150);
    if (token !== session) return;

    const matched = findMatchSet(board);
    if (matched.size === 0) {
      swapValues(a, b);
      renderBoard();
      boardEl.classList.add('invalid');
      showToast('这样交换无法消除，再试试～', 1200);
      await wait(360);
      if (token === session) {
        boardEl.classList.remove('invalid');
        busy = false;
      }
      return;
    }

    moves = Math.max(0, moves - 1);
    setCombo(1);
    updateHud();
    bump(movesValueEl);
    await resolveMatches(token);
    if (token !== session) return;

    if (moves <= 0) {
      busy = false;
      showGameOver();
      return;
    }

    if (!findPossibleMove(board)) {
      await autoShuffle(token);
      if (token !== session) return;
    }

    busy = false;
  }

  function onCellClick(index) {
    if (busy || gameOver) return;

    if (selected === -1) {
      selected = index;
      syncSelection();
      return;
    }

    if (selected === index) {
      selected = -1;
      syncSelection();
      return;
    }

    if (!isAdjacent(selected, index)) {
      selected = index;
      syncSelection();
      return;
    }

    const first = selected;
    selected = -1;
    syncSelection();
    attemptSwap(first, index);
  }

  function showGameOver() {
    gameOver = true;
    finalScoreEl.textContent = score.toLocaleString('zh-CN');

    if (score >= 4000) {
      overlayMessageEl.textContent = '水果宗师！这波连击太漂亮了。';
    } else if (score >= 2500) {
      overlayMessageEl.textContent = '水果达人！手感非常不错。';
    } else if (score >= 1200) {
      overlayMessageEl.textContent = '表现不错，再试一次冲击更高分！';
    } else {
      overlayMessageEl.textContent = '再来一局，留意能连成三个的交换。';
    }

    gameoverEl.hidden = false;
    requestAnimationFrame(() => gameoverEl.classList.add('show'));
    window.setTimeout(() => againBtn.focus({ preventScroll: true }), 260);
  }

  function hideGameOver() {
    gameoverEl.classList.remove('show');
    gameoverEl.hidden = true;
  }

  function newGame() {
    session++;
    busy = false;
    gameOver = false;
    selected = -1;
    score = 0;
    moves = START_MOVES;

    window.clearTimeout(toastTimer);
    window.clearTimeout(introTimer);
    window.clearTimeout(comboTimer);
    hideToast();
    hideGameOver();
    boardWrapEl.classList.remove('shuffling');
    boardEl.classList.remove('invalid');
    fxLayerEl.innerHTML = '';

    for (const cell of cells) {
      cell.classList.remove('matched', 'selected', 'swapped', 'drop-in');
    }
    for (const fruit of fruitSpans) fruit.textContent = '';

    scoreValueEl.textContent = '0';
    movesValueEl.textContent = String(START_MOVES);
    movesCardEl.classList.remove('low');
    comboValueEl.dataset.level = '1';
    comboValueEl.textContent = '×1';

    board = generateBoard();
    renderBoard();
    animateIntro();

    if (document.activeElement === againBtn) {
      restartBtn.focus({ preventScroll: true });
    }
  }

  boardEl.addEventListener('click', (event) => {
    const cell = event.target.closest('.cell');
    if (!cell || !boardEl.contains(cell)) return;
    onCellClick(Number(cell.dataset.index));
  });

  restartBtn.addEventListener('click', newGame);
  againBtn.addEventListener('click', newGame);
  musicBtn.addEventListener('click', music.toggle);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hideToast();
    music.handleVisibility();
  });

  buildGrid();
  newGame();
  music.armAutoStart();

  // A tiny read-only hook for automated smoke tests; it cannot alter game state.
  window.__fruitGame = {
    getState() {
      return {
        board: board.slice(),
        score,
        moves,
        busy,
        gameOver,
        selected,
        hasMatch: findMatchSet(board).size > 0,
        possibleMove: findPossibleMove(board.slice())
      };
    },
    getAudioState() {
      return music.getState();
    }
  };
})();
</script>
</body>
</html>
